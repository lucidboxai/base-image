[unix_http_server]
file=/var/run/supervisor.sock
chmod = 0700
username = ai-dock
password = ai-dock

[supervisord]
logfile=/var/log/supervisor/supervisor.log
logfile_maxbytes=50MB
logfile_backups=5
loglevel=info
pidfile=/var/run/supervisord.pid
nodaemon=true
minfds=1024 
minprocs=200
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# Loopback only. The sole client is the service portal (helpers.py), which
# connects over localhost. Bound to 0.0.0.0 this served supervisord's XML-RPC
# interface — start/stop/restart of any program, from a supervisord running as
# root — to every interface, unauthenticated, on any host that publishes all
# container ports.
[inet_http_server]
port = 127.0.0.1:9001
username = ai-dock
password = ai-dock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
username = ai-dock
password = ai-dock

[include]
files = /etc/supervisor/supervisord/conf.d/*.conf

